[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mitarget"
version = "0.1.0"
description = "Empirical-Bayes target encoding and mutual-information estimation for large, under-sampled categorical features"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Damian G. Hernandez" }]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
plots = ["matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mitarget.synthetic" = ["data/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E731"]
