[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mitarget"
version = "0.1.0"
description = "Empirical-Bayes target encoding and mutual-information estimation for large, under-sampled categorical features"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
authors = [{ name = "Damián G. Hernández" }]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "cvxpy>=1.4"]
lik = ["cvxpy>=1.4"]
plots = ["matplotlib>=3.6"]
catboost = ["catboost>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mitarget.synthetic" = ["data/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]
# Verbatim theory checks from the paper notes (exact sums, LPs); kept as written.
extend-exclude = ["experiments/paper/theory"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E731"]
